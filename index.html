<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>South Asia in Relief</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,650;12..96,800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+Devanagari:wght@500&family=Noto+Sans+Bengali:wght@500&family=Noto+Sans+Tamil:wght@500&family=Noto+Sans+Telugu:wght@500&family=Noto+Sans+Kannada:wght@500&family=Noto+Sans+Malayalam:wght@500&family=Noto+Sans+Sinhala:wght@500&family=Noto+Sans+Thaana:wght@500&family=Noto+Serif+Tibetan:wght@500&family=Noto+Naskh+Arabic:wght@500&family=Noto+Nastaliq+Urdu&display=swap">
<style>
html,body{margin:0}

/* Layout: a museum relief model on the left, a lesson notebook on the right; stacks on phones. */
:root{
  --bg:#ECEEF4; --surface:#FBFBFD; --ink:#151A36; --muted:#565D7B; --line:#D4D8E6;
  --indigo:#2D3B97; --indigo-soft:#E2E5F6; --turmeric:#A86C00; --turmeric-soft:#FAEDCF;
  --stage-a:#D7DEEC; --stage-b:#F2F4F9; --slab:#C7BFAA; --chip:rgba(251,251,253,.92);
  --good:#2F7D52; --bad:#B23A3A; --shadow:0 8px 28px rgba(21,26,54,.14);
  --map-ink:#161A33; --map-halo:rgba(255,255,255,.86); --map-sea:#F2F6FF; --map-sea-halo:rgba(16,32,78,.55);
  --r-hindu:#E39B2E; --r-muslim:#3C9A6B; --r-buddhist:#B5485B; --r-christian:#4A6FC4; --r-sikh:#7C5AB8; --r-other:#9AA0B4;
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Source Serif 4",Georgia,"Times New Roman",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B0F23; --surface:#11163A; --ink:#E7E9F6; --muted:#A0A6C6; --line:#272E58;
    --indigo:#9AA7FF; --indigo-soft:#1E2552; --turmeric:#F2B640; --turmeric-soft:#3A2E12;
    --stage-a:#070A1A; --stage-b:#18204A; --slab:#3B3629; --chip:rgba(17,22,58,.9);
    --good:#5CC48A; --bad:#F07C7C; --shadow:0 8px 28px rgba(0,0,0,.45); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B0F23; --surface:#11163A; --ink:#E7E9F6; --muted:#A0A6C6; --line:#272E58;
  --indigo:#9AA7FF; --indigo-soft:#1E2552; --turmeric:#F2B640; --turmeric-soft:#3A2E12;
  --stage-a:#070A1A; --stage-b:#18204A; --slab:#3B3629; --chip:rgba(17,22,58,.9);
  --good:#5CC48A; --bad:#F07C7C; --shadow:0 8px 28px rgba(0,0,0,.45); color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
[hidden]{display:none!important}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--turmeric);outline-offset:2px;border-radius:6px}
.app{display:flex;flex-direction:column;height:100%}

/* header */
.top{display:flex;align-items:center;gap:20px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--surface);border-bottom:1px solid var(--line);position:relative;z-index:5}
.brand{display:flex;align-items:baseline;gap:10px;flex-shrink:0}
.brand b{font-family:var(--f-display);font-weight:800;font-size:19px;letter-spacing:-.02em;font-variation-settings:"opsz" 40}
.brand span{font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.02em}
.tabs{display:flex;gap:2px;overflow-x:auto;min-width:0;flex:1;scrollbar-width:none;-ms-overflow-style:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:7px 11px;border-radius:8px;cursor:pointer;font-family:var(--f-display);font-weight:500;font-size:14px;color:var(--muted);white-space:nowrap;display:flex;gap:7px;align-items:baseline}
.tab i{font-style:normal;font-family:var(--f-mono);font-size:11px;opacity:.75}
.tab:hover{background:var(--indigo-soft);color:var(--ink)}
.tab[aria-current="true"]{background:var(--indigo);color:var(--surface)}
.tab[aria-current="true"] i{opacity:.9}

/* stage */
.stage{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 448px;min-height:0}
.map{position:relative;min-width:0;min-height:0;overflow:hidden;background:radial-gradient(120% 90% at 50% 10%,var(--stage-b),var(--stage-a))}
.map canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.map canvas:active{cursor:grabbing}
.labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;left:0;top:0;white-space:nowrap;will-change:transform;color:var(--map-ink);text-shadow:0 0 3px var(--map-halo),0 0 6px var(--map-halo)}
.lbl.nations{font-family:var(--f-display);font-weight:800;font-size:13px;letter-spacing:.16em;text-transform:uppercase}
.lbl.nations.sm{font-size:10.5px;letter-spacing:.12em}
.lbl.nations.nb{font-weight:500;opacity:.7}
.lbl.seas{font-family:var(--f-body);font-style:italic;font-size:15px;letter-spacing:.06em;color:var(--map-sea);text-shadow:0 0 4px var(--map-sea-halo),0 0 8px var(--map-sea-halo)}
.lbl.ranges{font-family:var(--f-display);font-weight:650;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#4A2F14;text-shadow:0 0 3px rgba(255,248,235,.95),0 0 7px rgba(255,248,235,.8)}
.lbl.rivers{font-family:var(--f-body);font-style:italic;font-size:12.5px;color:#123F86;text-shadow:0 0 3px rgba(255,255,255,.95),0 0 6px rgba(255,255,255,.8)}
.lbl.pop{font-family:var(--f-mono);font-size:12px;font-weight:500;background:var(--chip);color:var(--ink);text-shadow:none;padding:3px 7px;border-radius:5px;border:1px solid var(--line)}
.pin{position:absolute;left:0;top:0;pointer-events:auto;border:0;padding:0;background:none;cursor:pointer;will-change:transform}
.pin b{display:grid;place-items:center;min-width:24px;height:24px;padding:0 6px;border-radius:12px;background:var(--indigo);color:#fff;font-family:var(--f-mono);font-size:11px;font-weight:500;box-shadow:0 2px 8px rgba(0,0,0,.3);border:2px solid #fff;transition:transform .15s}
.pin::after{content:"";display:block;width:2px;height:12px;margin:0 auto;background:#fff;box-shadow:0 0 2px rgba(0,0,0,.5)}
.pin:hover b{transform:scale(1.12)}
.pin.on b{background:var(--turmeric);color:#1c1300;transform:scale(1.22)}
.pin .tip{position:absolute;left:50%;bottom:44px;transform:translateX(-50%);white-space:nowrap;font-family:var(--f-display);font-size:12px;font-weight:650;background:var(--chip);color:var(--ink);padding:3px 8px;border-radius:5px;border:1px solid var(--line);opacity:0;pointer-events:none;transition:opacity .12s}
.pin:hover .tip,.pin.on .tip,.pin:focus-visible .tip{opacity:1}

/* map controls */
.ov{position:absolute;z-index:3}
.box{background:var(--chip);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.layers{top:14px;left:max(16px,env(safe-area-inset-left,0px));display:flex;padding:3px;gap:2px}
.layers button{border:0;background:none;padding:6px 11px;border-radius:7px;font-family:var(--f-display);font-weight:500;font-size:13px;cursor:pointer;color:var(--muted)}
.layers button:hover{color:var(--ink)}
.layers button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.ctl{top:14px;right:16px;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.ctl .row{display:flex;gap:2px;padding:3px}
.ctl .row button{border:0;background:none;padding:5px 9px;border-radius:7px;font-family:var(--f-display);font-size:12.5px;cursor:pointer;color:var(--muted);display:flex;align-items:center;gap:6px}
.ctl .row button::before{content:"";width:8px;height:8px;border-radius:2px;border:1.5px solid currentColor}
.ctl .row button[aria-pressed="true"]{color:var(--ink)}
.ctl .row button[aria-pressed="true"]::before{background:var(--turmeric);border-color:var(--turmeric)}
.ctl .row button.plain::before{display:none}
.exag{display:flex;align-items:center;gap:8px;padding:6px 10px;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.exag input{width:110px;accent-color:var(--turmeric)}
.exag output{min-width:30px;color:var(--ink);font-variant-numeric:tabular-nums}
.legend{right:16px;bottom:14px;padding:10px 12px;width:250px;font-family:var(--f-display);font-size:12px}
.legend h4{margin:0 0 6px;font-size:11px;font-weight:650;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.legend .bar{height:10px;border-radius:3px}
.legend .ticks{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:10px;color:var(--muted);margin-top:3px;font-variant-numeric:tabular-nums}
.legend .sw{display:grid;grid-template-columns:1fr 1fr;gap:3px 10px}
.legend .sw span{display:flex;align-items:center;gap:6px;min-width:0}
.legend .sw i{width:11px;height:11px;border-radius:3px;flex-shrink:0;border:1px solid rgba(0,0,0,.15)}
.readout{margin-top:8px;padding-top:7px;border-top:1px solid var(--line);font-family:var(--f-mono);font-size:11px;color:var(--muted);min-height:2.6em;font-variant-numeric:tabular-nums}
.readout b{color:var(--ink);font-weight:500}
.card{left:max(16px,env(safe-area-inset-left,0px));bottom:14px;width:min(380px,calc(100% - 300px));padding:14px 16px 12px;max-height:calc(100% - 90px);overflow:auto}
.card .k{font-family:var(--f-mono);font-size:11px;color:var(--turmeric);letter-spacing:.03em;text-transform:uppercase}
.card h3{margin:2px 0 4px;font-family:var(--f-display);font-weight:800;font-size:21px;line-height:1.15;letter-spacing:-.01em;text-wrap:balance}
.card .co{font-family:var(--f-mono);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.card p{margin:8px 0 10px;font-size:15px;line-height:1.5}
.card .nav{display:flex;align-items:center;gap:6px;border-top:1px solid var(--line);padding-top:9px}
.card .nav button{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:4px 10px;cursor:pointer;font-family:var(--f-display);font-size:13px}
.card .nav button:hover{border-color:var(--indigo)}
.card .nav .ct{font-family:var(--f-mono);font-size:11px;color:var(--muted);margin-right:auto}
.card .x{position:absolute;top:8px;right:8px;border:0;background:none;width:28px;height:28px;border-radius:7px;cursor:pointer;font-size:18px;line-height:1;color:var(--muted)}
.card .x:hover{background:var(--indigo-soft);color:var(--ink)}
.loader{position:absolute;inset:0;display:grid;place-items:center;z-index:4;background:radial-gradient(120% 90% at 50% 10%,var(--stage-b),var(--stage-a))}
.loader div{font-family:var(--f-mono);font-size:12px;color:var(--muted);text-align:center}
.loader .pbar{width:220px;height:3px;background:var(--line);border-radius:2px;margin:10px auto 0;overflow:hidden}
.loader .pbar i{display:block;height:100%;width:0;background:var(--turmeric);transition:width .2s}
.note-ex{position:absolute;left:max(16px,env(safe-area-inset-left,0px));top:58px;z-index:2;font-family:var(--f-mono);font-size:10.5px;color:var(--muted);pointer-events:none}

/* panel */
.panel{overflow-y:auto;min-width:0;background:var(--surface);border-left:1px solid var(--line)}
.lesson{padding-block:26px 48px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px;max-width:640px}
.eyebrow{margin:0;font-family:var(--f-mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--turmeric)}
.lesson h1{margin:-14px 0 0;font-family:var(--f-display);font-weight:800;font-size:40px;line-height:1.02;letter-spacing:-.03em;text-wrap:balance;font-variation-settings:"opsz" 96}
.lead{margin:0;font-size:19px;line-height:1.45;color:var(--ink)}
.lesson h2{margin:0 0 10px;font-family:var(--f-display);font-weight:650;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;gap:8px;text-wrap:balance}
.lesson h2 span{letter-spacing:.04em;text-transform:none;font-family:var(--f-mono);font-weight:400}
.obj ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.obj li{padding-left:22px;position:relative;font-size:15.5px}
.obj li::before{content:"";position:absolute;left:2px;top:.55em;width:10px;height:10px;border:2px solid var(--indigo);border-radius:50%}
.prose p{margin:0 0 12px;font-size:16px}
.prose p:last-child{margin-bottom:0}
.prose .aside{font-size:14px;color:var(--muted);border-left:3px solid var(--line);padding-left:12px}
.now{background:var(--turmeric-soft);border-radius:10px;padding:12px 14px;font-size:15px}
.now b{font-family:var(--f-display);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--turmeric);display:block;margin-bottom:2px}
.stops ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:2px}
.stop{width:100%;display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;align-items:baseline;text-align:left;border:0;background:none;padding:8px 10px;border-radius:8px;cursor:pointer}
.stop:hover{background:var(--indigo-soft)}
.stop.on{background:var(--indigo-soft);box-shadow:inset 3px 0 0 var(--turmeric)}
.stop .n{font-family:var(--f-mono);font-size:11px;color:var(--indigo);font-variant-numeric:tabular-nums}
.stop .t{font-family:var(--f-display);font-weight:650;font-size:15px;display:block;line-height:1.25}
.stop .s{font-family:var(--f-mono);font-size:11px;color:var(--muted);display:block;margin-top:1px}
.timeline .stop{grid-template-columns:92px minmax(0,1fr)}
.timeline .stop .n{font-size:11px;color:var(--turmeric);text-align:right}
.tourbtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;font-family:var(--f-display);font-size:13px;cursor:pointer;margin-top:8px}
.tourbtn:hover{border-color:var(--indigo)}
.terms dl{margin:0;display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.terms dt{font-family:var(--f-display);font-weight:650;font-size:15px}
.terms dd{margin:2px 0 0;font-size:15px;color:var(--muted)}
.discuss{border:1px dashed var(--line);border-radius:12px;padding:14px 16px}
.discuss p{margin:0;font-size:16px;font-style:italic}
.pager{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding-top:16px}
.pager button{border:0;background:none;cursor:pointer;text-align:left;padding:6px 0;font-family:var(--f-display);min-width:0}
.pager button span{display:block;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.pager button b{font-weight:650;font-size:16px;color:var(--indigo)}
.pager button:last-child{text-align:right;margin-left:auto}

/* widgets */
.widget{display:flex;flex-direction:column;gap:8px;min-width:0}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-family:var(--f-display);font-weight:650;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--bg)}
td.num,th.num{text-align:right;font-family:var(--f-mono);font-size:12.5px;font-variant-numeric:tabular-nums}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--indigo-soft)}
tbody tr:last-child td{border-bottom:0}
tfoot td{font-weight:600;border-bottom:0;border-top:1px solid var(--line);background:var(--bg)}
.src{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);line-height:1.5;margin:0}
.svgwrap{overflow-x:auto}
.svgwrap svg{display:block;width:100%;height:auto;min-width:340px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;padding:3px;gap:2px;background:var(--bg);align-self:flex-start;flex-wrap:wrap}
.seg button{border:0;background:none;border-radius:6px;padding:5px 10px;cursor:pointer;font-family:var(--f-display);font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.rel{display:flex;flex-direction:column;gap:7px}
.rel .r{display:grid;grid-template-columns:90px minmax(0,1fr);gap:10px;align-items:center;font-size:13.5px}
.rel .r span{font-family:var(--f-display);font-weight:650}
.rel .bars{display:flex;height:16px;border-radius:4px;overflow:hidden;background:var(--line)}
.rel .bars i{display:block;height:100%}
.rel .r small{grid-column:2;font-family:var(--f-mono);font-size:10.5px;color:var(--muted);margin-top:-4px}
.keyrow{display:flex;flex-wrap:wrap;gap:4px 12px;font-family:var(--f-display);font-size:12.5px}
.keyrow span{display:flex;gap:5px;align-items:center}
.keyrow i{width:10px;height:10px;border-radius:2px}
.scripts{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:8px}
.scripts div{border:1px solid var(--line);border-radius:10px;padding:10px 10px 8px;min-width:0}
.scripts .w{font-size:26px;line-height:1.5;display:block;min-height:42px}
.scripts .tr{font-family:var(--f-mono);font-size:11px;color:var(--ink);display:block}
.scripts .ln{font-family:var(--f-display);font-size:11.5px;color:var(--muted);display:block}
.dens .r{display:grid;grid-template-columns:96px minmax(0,1fr) 62px;gap:10px;align-items:center;font-size:13.5px;padding:3px 0}
.dens .r span{font-family:var(--f-display);font-weight:650}
.dens .r i{display:block;height:12px;border-radius:3px;background:var(--indigo)}
.dens .r em{font-style:normal;font-family:var(--f-mono);font-size:12px;text-align:right;font-variant-numeric:tabular-nums}
.tagh{font-family:var(--f-display);font-weight:650;font-size:13px;margin:12px 0 2px;color:var(--turmeric)}
.tagh:first-child{margin-top:0}

/* quiz */
.quiz{display:flex;flex-direction:column;gap:18px}
.score{font-family:var(--f-display);font-size:15px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.score b{font-family:var(--f-mono);font-size:20px;color:var(--indigo);font-variant-numeric:tabular-nums}
.q{border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.q h3{margin:0 0 10px;font-family:var(--f-display);font-weight:650;font-size:17px;line-height:1.3;text-wrap:balance}
.q h3 i{font-style:normal;font-family:var(--f-mono);font-size:11px;color:var(--muted);display:block;margin-bottom:2px}
.q .opts{display:grid;gap:6px}
.q .opts button{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;cursor:pointer;font-size:15px}
.q .opts button:hover:not(:disabled){border-color:var(--indigo)}
.q .opts button:disabled{cursor:default}
.q .opts button.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,transparent)}
.q .opts button.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}
.q .fb{margin:10px 0 0;font-size:14.5px}
.q .fb b{font-family:var(--f-display)}

@media (max-width:900px){
  html,body{height:auto}
  .app{height:auto;min-height:100%}
  .stage{display:block}
  .map{height:62vh;min-height:380px;max-height:640px}
  .panel{border-left:0;border-top:1px solid var(--line)}
  .lesson{max-width:none}
  .top{flex-wrap:wrap;gap:6px 14px}
  .tabs{flex-basis:100%}
  .brand span{display:none}
  .legend{width:200px;padding:8px 10px}
  .card{width:auto;right:16px;bottom:10px;max-height:58%}
  .card ~ .legend{display:none}
  .map.carded .legend{display:none}
  .ctl .exag{display:none}
  .readout{display:none}
  .note-ex{display:none}
}
@media (max-width:520px){
  .layers button{padding:5px 8px;font-size:12px}

  let e=Math.max(base,p,m);
  for(const k of PEAKS){const dx=x-k[0]*KX,dy=lat-k[1],d2=dx*dx+dy*dy,R=k[3];if(d2<9*R*R){const v=k[2]*Math.exp(-d2/(R*R));if(v>e)e=v;}}
  for(const q of DIPS){const dx=x-q[0]*KX,dy=lat-q[1],w=Math.exp(-(dx*dx+dy*dy)/(q[2]*q[2]));if(e>q[3])e=lerp(e,q[3],w);}
  return Math.max(1,e);
}

}

{id:'monsoon',tab:'Monsoon',kicker:'Climate and rivers',title:'Monsoon & Rivers',layer:'rain',labels:['seas','rivers'],view:[81,20,44],winds:true,
 lead:'Monsoon comes from the Arabic word mawsim, "season". Each summer the land heats faster than the ocean, and moist winds blow in from the southwest. Each winter the pattern reverses.',
 obj:['Explain the seasonal reversal of winds','Use the rainfall layer to identify wet and dry regions','Distinguish orographic rain from rain shadow','Compare Himalayan and peninsular rivers'],
 prose:['<p>The southwest monsoon usually reaches Kerala around <b>1 June</b> and covers almost all of India by early July. In much of the region it brings most of the year\'s rain between June and September. Where the winds meet the Western Ghats or the Meghalaya plateau, air is forced upward, cools and drops heavy <b>orographic rain</b>. Land on the far side lies in a <b>rain shadow</b>.</p>','<p>In winter, cool dry air flows from the land toward the sea. Winds crossing the Bay of Bengal from the northeast pick up moisture and bring rain to Tamil Nadu and Sri Lanka from October to December: the <b>northeast monsoon</b>.</p>','<p>Himalayan rivers such as the Indus, Ganga and Brahmaputra are fed by snow and glaciers as well as rain, so they flow all year. Peninsular rivers such as the Godavari, Krishna and Kaveri depend on monsoon rain and shrink in the dry season.</p>'],
 widget:'monsoon',
 stops:[
  {n:'Kochi, Kerala',lon:76.27,lat:9.93,d:9,k:'Monsoon onset · ~1 June',t:'The India Meteorological Department declares the monsoon\'s arrival when steady rain and winds set in over Kerala, normally around 1 June. Farmers across the region watch this date closely.'},
  {n:'Mumbai',lon:72.88,lat:19.08,d:8,k:'~2,400 mm a year',t:'Most of the city\'s rain falls between June and September. On 26 July 2005, about 944 mm fell at Santacruz in 24 hours, one of the heaviest daily totals ever recorded in India.'},
  {n:'Pune',lon:73.86,lat:18.52,d:8,k:'Rain shadow · ~700 mm',t:'Only about 120 km inland from Mumbai, but on the leeward side of the Western Ghats. Air sinks and warms after crossing the mountains, so Pune gets less than a third of Mumbai\'s rain.'},
  {n:'Mawsynram',lon:91.58,lat:25.30,d:7,k:'~11,800 mm a year',t:'Moist winds from the Bay of Bengal are funnelled against the steep southern edge of the Meghalaya plateau. Mawsynram and nearby Cherrapunji compete for the title of wettest place on Earth.'},
  {n:'Jacobabad',lon:68.44,lat:28.28,d:9,k:'Extreme heat',t:'One of the hottest cities on Earth, with summer highs above 50 °C. Scientists have measured combinations of heat and humidity here close to the limit the human body can tolerate.'},
  {n:'Leh, Ladakh',lon:77.58,lat:34.16,d:8,k:'~100 mm a year · 3,500 m',t:'North of the Great Himalaya, monsoon clouds rarely reach. Ladakh is a cold desert where farming depends on channels carrying meltwater from snow and glaciers.'},
  {n:'Chennai',lon:80.27,lat:13.08,d:9,k:'Northeast monsoon',t:'Chennai gets most of its rain from October to December, when northeast winds cross the Bay of Bengal. Compare its bars with Mumbai\'s in the lesson panel.'},
  {n:'Odisha coast',lon:85.83,lat:19.81,d:9,k:'Cyclone coast',t:'Tropical cyclones form over the warm Bay of Bengal, mostly before and after the monsoon. After a 1999 super cyclone killed about 10,000 people, Odisha built shelters and warning systems that have since saved many lives.'},
  {n:'Gangotri Glacier',lon:79.08,lat:30.92,d:7,k:'Source of the Ganga',t:'Meltwater from this glacier emerges at Gaumukh as the Bhagirathi, a headstream of the Ganga. Snow and ice keep Himalayan rivers flowing through the dry season.'},
  {n:'Brahmaputra Great Bend',lon:95.0,lat:29.5,d:8,k:'Yarlung Tsangpo Gorge',t:'The river flows east across Tibet as the Yarlung Tsangpo, then turns sharply around Namcha Barwa through one of the deepest canyons on Earth before entering India. In 2025 China began building a very large hydropower project on this stretch, which India and Bangladesh watch closely.'}
 ],
 terms:[['Monsoon','A seasonal reversal of prevailing winds, bringing a wet season and a dry season.'],['Orographic rain','Rain caused when moist air is forced up over mountains, cools and condenses.'],['Rain shadow','A drier area on the leeward side of mountains.'],['ITCZ','Intertropical Convergence Zone: a belt of rising air and rain that shifts north over South Asia in summer.'],['Perennial river','A river that flows all year, often fed by snow and glacier melt.']],
 discuss:'A late or weak monsoon can raise food prices across the region. Trace the chain of effects from rain to farm to market to household.'},

{id:'culture',tab:'Culture',kicker:'Peoples and languages',title:'Peoples & Languages',layer:'lang',labels:['nations'],view:[80,21,44],
 lead:'South Asia is one of the most linguistically diverse places on Earth. Hundreds of languages belong to a few large families and are written in dozens of scripts.',
 obj:['Identify the five main language families and where they are spoken','Connect language to identity and politics','Link food traditions to climate and farming'],
 prose:['<p><b>Indo-Aryan</b> languages (Hindi, Urdu, Bengali, Punjabi, Marathi, Gujarati, Nepali, Sinhala and more) dominate the north and the plains. <b>Dravidian</b> languages (Tamil, Telugu, Kannada, Malayalam) dominate the south. <b>Tibeto-Burman</b> languages are spoken across the Himalaya and the northeast, <b>Iranian</b> languages such as Pashto, Dari and Balochi in the west, and <b>Austroasiatic</b> languages such as Khasi and Santali in scattered pockets.</p>','<p>India\'s constitution lists 22 scheduled languages, and in 1956 many Indian state borders were redrawn along language lines. Urdu is Pakistan\'s national language, Bengali (Bangla) is Bangladesh\'s, Nepali is Nepal\'s, Sinhala and Tamil are Sri Lanka\'s, Dzongkha is Bhutan\'s, Dhivehi is the Maldives\', and Pashto and Dari are Afghanistan\'s.</p>','<p>Food follows the land. Rice is the staple of the wet east, the south and the deltas; wheat breads such as roti dominate the drier north-west; hardy millets grow in drylands. Shared passions cross borders too: cricket, film music, and festivals such as Diwali, Eid, Vesak, Holi and Pohela Boishakh, the Bengali New Year.</p>','<p class="aside">The language layer is a simplified sketch of the main family in each area. In reality, languages mix, especially in cities.</p>'],
 widget:'scripts',
 stops:[
  {n:'Lucknow',lon:80.95,lat:26.85,d:9,k:'Hindi–Urdu heartland',t:'Hindi and Urdu share most everyday grammar and vocabulary. They differ mainly in script (Devanagari or Perso-Arabic) and in formal words borrowed from Sanskrit or from Persian and Arabic. Lucknow is known for Urdu poetry and Awadhi cooking.'},
  {n:'Dhaka · Shaheed Minar',lon:90.4,lat:23.73,d:8,k:'21 February 1952',t:'Students were killed here protesting for Bengali to be a state language of Pakistan. The date is now UNESCO\'s International Mother Language Day, and the movement fed the later struggle for Bangladesh\'s independence.'},
  {n:'Chennai',lon:80.27,lat:13.08,d:9,k:'Tamil',t:'Tamil has a literary record more than 2,000 years old and in 2004 became the first language India declared "classical". It is also an official language of Sri Lanka and Singapore.'},
  {n:'Lahore',lon:74.34,lat:31.55,d:8,k:'Punjabi',t:'Punjab, the "land of five rivers", was divided in 1947. Punjabi is written in Shahmukhi (Perso-Arabic) script in Pakistan and in Gurmukhi script in India.'},
  {n:'Kalat, Balochistan',lon:66.59,lat:29.03,d:9,k:'Brahui',t:'Brahui is a Dravidian language spoken more than 1,000 km from its southern relatives. How it came to be here is still debated by linguists.'},
  {n:'Shillong, Meghalaya',lon:91.88,lat:25.58,d:8,k:'Khasi',t:'Khasi belongs to the Austroasiatic family, related to languages such as Khmer and Vietnamese. Khasi society is traditionally matrilineal: family names and inheritance pass through the female line.'},
  {n:'Kerala Kalamandalam',lon:76.29,lat:10.74,d:8,k:'Kathakali',t:'Kerala\'s dance-drama, with painted faces and towering costumes, tells stories from the Mahabharata and Ramayana. India recognises several classical dance forms, including Bharatanatyam, Kathak and Odissi.'},
  {n:'Mumbai',lon:72.88,lat:19.08,d:8,k:'Film capital',t:'Mumbai\'s Hindi film industry, nicknamed Bollywood, is one of several big film centres; Tamil, Telugu, Malayalam and Bengali cinema are also large. India makes more feature films each year than any other country.'},
  {n:'Ludhiana, Punjab',lon:75.85,lat:30.9,d:9,k:'Wheat belt',t:'Irrigated Punjab and Haryana are India\'s breadbasket. Wheat breads such as roti and paratha are daily staples in the drier north-west.'},
  {n:'Bardhaman, West Bengal',lon:87.86,lat:23.23,d:9,k:'Rice bowl',t:'On the wet, flat plains of the east and south, rice is the staple. Bengal, Bangladesh and the southern deltas grow rice in flooded paddies during the monsoon.'},
  {n:'Leh, Ladakh',lon:77.58,lat:34.16,d:8,k:'Tibetan Buddhist culture',t:'Ladakh\'s monasteries, prayer flags and Tibetic language link it to the culture of the Tibetan Plateau rather than to the plains below.'}
 ],
 terms:[['Language family','A group of languages descended from a common ancestor.'],['Script','A writing system. One language can use several scripts, and one script can serve several languages.'],['Lingua franca','A shared language used between speakers of different languages, such as English or Hindustani.'],['Linguistic state','An Indian state whose borders were drawn around a main language, as after 1956.']],
 discuss:'Bangladesh\'s Language Movement shows how language can shape national identity. Find another South Asian example where language influenced political boundaries.'},

{id:'religion',tab:'Religion',kicker:'Sacred geography',title:'Sacred Geography',layer:'nations',labels:['nations','rivers'],view:[80,22,42],
 lead:'Four world religions began in South Asia: Hinduism, Buddhism, Jainism and Sikhism. Islam, Christianity and Zoroastrianism arrived over land and by sea. Today the region holds most of the world\'s Hindus and roughly a third of its Muslims.',
 obj:['Locate the birthplaces and holy sites of South Asia\'s religions','Compare the religious make-up of each country','Explain how faith is written into the landscape'],
 prose:['<p>Religion is part of the landscape. Rivers such as the Ganga are sacred, mountains such as Kailash are circled by pilgrims of several faiths, and pilgrimage routes have linked distant regions for thousands of years.</p>','<p>Islam reached the coasts with Arab traders in the 7th century and Sindh by conquest in 711–712; it spread widely later under the Delhi Sultanate and the Mughals, often through Sufi teachers. Pakistan, India and Bangladesh each have well over 150 million Muslims.</p>','<p>The 1947 Partition, which divided British India largely along religious lines, remains one of the region\'s defining events. Most South Asian states are home to significant religious minorities.</p>'],
 widget:'religion',
 stops:[
  {n:'Varanasi',lon:83.01,lat:25.32,d:8,k:'Hinduism',t:'Among the world\'s oldest continuously inhabited cities and Hinduism\'s holiest. Pilgrims bathe at the ghats on the Ganga, and many Hindus hope to be cremated here.'},
  {n:'Prayagraj',lon:81.89,lat:25.43,d:8,k:'Kumbh Mela',t:'Where the Ganga and Yamuna meet. Officials counted more than 600 million pilgrim visits to the 2025 Maha Kumbh Mela over six weeks, one of the largest gatherings in human history.'},
  {n:'Lumbini',lon:83.28,lat:27.47,d:8,k:'Buddhism · Nepal',t:'Birthplace of Siddhartha Gautama, the Buddha, around the 6th–5th century BCE. A pillar raised by the emperor Ashoka in about 249 BCE marks the spot.'},
  {n:'Bodh Gaya',lon:84.99,lat:24.69,d:8,k:'Buddhism',t:'Where the Buddha attained enlightenment under the Bodhi tree. The Mahabodhi Temple is a UNESCO World Heritage Site.'},
  {n:'Sarnath',lon:83.03,lat:25.38,d:7,k:'Buddhism',t:'Site of the Buddha\'s first sermon. The Lion Capital of Ashoka found here is now the national emblem of India.'},
  {n:'Golden Temple, Amritsar',lon:74.88,lat:31.62,d:8,k:'Sikhism',t:'Harmandir Sahib, the holiest gurdwara of Sikhism. Its community kitchen (langar) serves free meals to tens of thousands of people of any faith every day.'},
  {n:'Kartarpur Sahib',lon:75.03,lat:32.09,d:8,k:'Sikhism · Pakistan',t:'Guru Nanak, founder of Sikhism, born in 1469 at Nankana Sahib (also in Pakistan), spent his last years here. A visa-free corridor for Indian pilgrims opened in 2019; it has been closed during periods of tension.'},
  {n:'Palitana',lon:71.82,lat:21.52,d:8,k:'Jainism',t:'Shatrunjaya hill holds more than 800 Jain temples. Jainism, which teaches strict non-violence (ahimsa), was shaped by Mahavira in the 6th–5th century BCE.'},
  {n:'Mount Kailash',lon:81.31,lat:31.07,d:7,k:'Sacred to four faiths',t:'A 6,638 m peak in Tibet, sacred to Hindus, Buddhists, Jains and followers of Bon. Pilgrims walk a circuit of about 52 km around it; climbing it is not permitted.'},
  {n:'Kandy',lon:80.64,lat:7.29,d:7,k:'Buddhism · Sri Lanka',t:'The Temple of the Sacred Tooth Relic holds a relic of the Buddha. Buddhism reached Sri Lanka in the 3rd century BCE, traditionally through Mahinda, a son of Ashoka.'},
  {n:'Paro Taktsang',lon:89.36,lat:27.49,d:7,k:'Buddhism · Bhutan',t:'The Tiger\'s Nest monastery clings to a cliff about 900 m above the Paro valley. Vajrayana Buddhism shapes Bhutan\'s law, architecture and festivals.'},
  {n:'Data Darbar, Lahore',lon:74.3,lat:31.58,d:8,k:'Sufi Islam',t:'Shrine of the 11th-century Sufi saint Ali Hujwiri. Sufi shrines across the region welcome visitors of many faiths and are famous for qawwali music.'},
  {n:'Ajmer Sharif',lon:74.63,lat:26.46,d:8,k:'Sufi Islam · India',t:'Shrine of Moinuddin Chishti (died 1236), one of the most visited Muslim pilgrimage sites in South Asia.'},
  {n:'Old Goa',lon:73.91,lat:15.5,d:8,k:'Christianity',t:'The Portuguese took Goa in 1510; the Basilica of Bom Jesus holds the remains of St Francis Xavier. Kerala\'s Christian communities are older still, tracing their origin to the apostle Thomas.'},
  {n:'Udvada',lon:72.87,lat:20.48,d:8,k:'Zoroastrianism',t:'Parsis descend from Zoroastrians who left Persia more than a thousand years ago. Udvada\'s fire temple keeps their most sacred fire, burning for centuries.'}
 ],
 terms:[['Pilgrimage','A journey to a sacred place. Hindus call such places tirthas, "crossing places".'],['Sufism','A mystical tradition within Islam, central to its spread in South Asia.'],['Syncretism','The blending of beliefs and practices from different religions.'],['Secular state','A state that does not adopt an official religion. India\'s constitution describes it as secular.']],
 discuss:'Why do so many sacred sites stand beside rivers or on mountains? Compare them with a sacred landscape you know.'},

{id:'history',tab:'History',kicker:'Through time',title:'Through Time',layer:'relief',labels:['nations','seas'],view:[79,23,44],timeline:true,
 lead:'From some of the world\'s first farming villages to the birth of new nations in the 20th century, South Asian history moves across this map. Follow the stops in order, or press Play tour.',
 obj:['Place major civilisations and empires in time and space','Explain how geography shaped where power was centred','Describe the causes and effects of colonial rule and Partition'],
 prose:['<p>Empires repeatedly rose on the fertile <b>Ganga–Yamuna plain</b>, with its water, farmland and river transport. Invaders and traders entered through north-western passes such as the Khyber or arrived by sea, while the south built its own maritime kingdoms that traded across the Indian Ocean.</p>','<p>European trading companies arrived from 1498, when Vasco da Gama reached Kerala. The British East India Company gradually took control, followed by direct British rule from 1858 to 1947.</p>'],
 widget:'none',
 stops:[
  {n:'Mehrgarh',lon:67.62,lat:29.38,d:8,k:'c. 7000 BCE',t:'One of South Asia\'s earliest farming villages, at the foot of the Bolan Pass. People grew wheat and barley and kept cattle, sheep and goats thousands of years before the Indus cities.'},
  {n:'Mohenjo-daro',lon:68.14,lat:27.33,d:8,k:'c. 2600–1900 BCE',t:'A great city of the Indus Valley (Harappan) Civilization, with grid streets, brick houses, covered drains and the Great Bath. Its script has still not been deciphered.'},
  {n:'Kurukshetra',lon:76.85,lat:29.97,d:9,k:'c. 1500–500 BCE',t:'The Vedic period. The Sanskrit hymns of the Rigveda were composed in the north-west, and Vedic culture spread east across the Ganga plain. Kurukshetra is the setting of the great battle of the Mahabharata.'},
  {n:'Taxila',lon:72.83,lat:33.75,d:8,k:'c. 600 BCE – 500 CE',t:'A city of Gandhara on major trade routes. Persian, Greek, Mauryan and Kushan rulers left their mark, and Gandharan art blended Greek and Buddhist styles.'},
  {n:'Pataliputra (Patna)',lon:85.14,lat:25.61,d:9,k:'322–185 BCE',t:'Capital of the Maurya Empire, founded by Chandragupta Maurya. His grandson Ashoka renounced war after the bloody conquest of Kalinga and promoted Buddhist ideas in edicts carved on rocks and pillars.'},
  {n:'Anuradhapura',lon:80.4,lat:8.31,d:8,k:'4th c. BCE – 11th c. CE',t:'Capital of early Sinhalese kingdoms for over a thousand years, with huge stupas and reservoirs (tanks) that stored monsoon rain for rice farming.'},
  {n:'Nalanda',lon:85.44,lat:25.14,d:8,k:'5th – 12th c. CE',t:'A great Buddhist university founded in the Gupta era (c. 320–550 CE), a classical age of Sanskrit literature, art and science. The mathematician-astronomer Aryabhata worked in this period.'},
  {n:'Thanjavur',lon:79.13,lat:10.78,d:8,k:'c. 850–1279 CE',t:'Capital of the Chola Empire, whose fleets reached Sri Lanka and Southeast Asia. Rajaraja I completed the Brihadisvara Temple here in 1010.'},
  {n:'Delhi · Qutb Minar',lon:77.19,lat:28.52,d:8,k:'1206–1526',t:'The Delhi Sultanate brought Turkic and Afghan dynasties, Persian as a court language, and Indo-Islamic architecture such as the Qutb Minar.'},
  {n:'Hampi',lon:76.46,lat:15.33,d:8,k:'1336–1646',t:'Capital of the Vijayanagara Empire and one of the largest cities in the world around 1500. It was sacked after the Battle of Talikota in 1565.'},
  {n:'Agra',lon:78.04,lat:27.17,d:8,k:'1526–1857',t:'Babur founded the Mughal Empire after the First Battle of Panipat in 1526. At its height it ruled most of the subcontinent. Shah Jahan built the Taj Mahal here between 1632 and 1653.'},
  {n:'Plassey',lon:88.25,lat:23.8,d:8,k:'1757',t:'The British East India Company defeated the Nawab of Bengal, beginning its rise from trading company to ruling power.'},
  {n:'Meerut',lon:77.71,lat:28.98,d:8,k:'1857',t:'Indian soldiers (sepoys) of the Company\'s army rebelled here, starting a widespread uprising. In 1858 the British Crown took direct control, beginning the British Raj.'},
  {n:'Wagah–Attari',lon:74.57,lat:31.6,d:8,k:'1947',t:'British India was partitioned into India and Pakistan, with East Pakistan in Bengal. Around 15 million people were uprooted and estimates of the dead range from several hundred thousand to two million. This crossing between Lahore and Amritsar became a symbol of the divide.'},
  {n:'Colombo',lon:79.86,lat:6.93,d:8,k:'1948',t:'Ceylon gained independence from Britain on 4 February 1948 and became the Republic of Sri Lanka in 1972.'},
  {n:'Dhaka',lon:90.41,lat:23.81,d:8,k:'1971',t:'After a war of independence, East Pakistan became Bangladesh. Pakistani forces surrendered in Dhaka on 16 December 1971.'},
  {n:'Kathmandu',lon:85.32,lat:27.72,d:8,k:'2008',t:'Nepal, never colonised, abolished its monarchy and became a federal democratic republic. Bhutan, also never colonised, held its first parliamentary elections the same year.'}
 ],
 terms:[['Civilization','A complex society with cities, specialised work, government and often writing.'],['Empire','A large state ruling many peoples and territories from one centre.'],['Colonialism','Control of one territory and its people by a foreign power.'],['Partition','The 1947 division of British India into India and Pakistan.']],
 discuss:'Many capitals in this timeline stand on the Ganga–Yamuna plain. What geographic advantages did the plain give rulers, and what made it hard to defend?'},

{id:'people',tab:'People',kicker:'Population and cities',title:'People & Cities',layer:'nations',labels:['nations'],view:[82,21,42],columns:true,
 lead:'About 2 billion people live in South Asia. India passed China as the world\'s most populous country in 2023, and the region\'s cities are among the largest and fastest-growing on Earth.',
 obj:['Describe where population is dense or sparse, and why','Compare population density between countries','Explain push and pull factors behind urban growth and migration'],
 prose:['<p>Population follows water and soil. Densities are highest on the Ganga plain and in the Bengal delta and lowest in deserts and high mountains. <b>Bangladesh</b>, with about 175 million people in an area about the size of the US state of Iowa, is the most densely populated large country in the world.</p>','<p>In a 2025 report using a new, consistent definition of cities, the UN ranked <b>Dhaka</b> the world\'s second-largest urban area, with New Delhi fifth and Kolkata ninth. The gold columns on the map show their size.</p>','<p>Millions of South Asians work abroad, especially in the Gulf states. The money they send home, called <b>remittances</b>, is a large share of the economy in Nepal, Pakistan, Bangladesh and Sri Lanka.</p>'],
 widget:'density',
 stops:[
  {n:'Dhaka',lon:90.41,lat:23.81,d:9,k:'36.6 million · UN 2025',t:'Ranked the world\'s second-largest urban area. Migrants arrive from rural areas hit by river erosion and floods, and the garment industry is a major employer.'},
  {n:'New Delhi',lon:77.21,lat:28.61,d:9,k:'30.2 million · UN 2025',t:'The capital region sprawls into neighbouring states. Ranked fifth in the world by the same UN report.'},
  {n:'Kolkata',lon:88.36,lat:22.57,d:9,k:'22.5 million · UN 2025',t:'Capital of British India until 1911 and a centre of Bengali literature, politics and film. Ranked ninth in the world.'},
  {n:'Mumbai · Dharavi',lon:72.85,lat:19.04,d:8,k:'Financial capital',t:'India\'s financial centre and a major port. Dharavi, one of Asia\'s largest informal settlements, is also a busy hub of small factories and recycling.'},
  {n:'Karachi',lon:67.01,lat:24.86,d:8,k:'Pakistan\'s largest city',t:'Pakistan\'s main port and economic engine, and its capital until the 1960s. It grew rapidly after 1947 as migrants arrived from India.'},
  {n:'Lahore',lon:74.34,lat:31.55,d:8,k:'Pakistan\'s second city',t:'A historic cultural capital with Mughal monuments such as the Badshahi Mosque and Lahore Fort.'},
  {n:'Bengaluru',lon:77.59,lat:12.97,d:8,k:'Technology hub',t:'India\'s best-known IT centre. Rapid growth has strained its lakes, water supply and roads.'},
  {n:'Kathmandu Valley',lon:85.32,lat:27.7,d:7,k:'Mountain city',t:'The valley holds a large share of Nepal\'s urban population. Remittances from Nepalis working abroad equal roughly a quarter of the country\'s GDP.'},
  {n:'Greater Malé',lon:73.51,lat:4.18,d:7,k:'Island density',t:'More than a third of Maldivians live in the Greater Malé area. Hulhumalé, a new town on land reclaimed from the lagoon, was built about 2 m above sea level.'}
 ],
 terms:[['Population density','Number of people per square kilometre.'],['Urbanization','The growth in the share of people living in towns and cities.'],['Megacity','An urban area with more than 10 million people.'],['Remittances','Money sent home by migrants working elsewhere.']],
 discuss:'Rural migrants keep arriving in Dhaka despite crowding and flooding. List the push factors and the pull factors, and suggest one policy that might help.'},

{id:'environment',tab:'Environment',kicker:'Environmental issues',title:'Environment at Risk',layer:'relief',labels:['nations','rivers'],view:[80,22,42],
 lead:'South Asia is among the regions most exposed to climate change. Melting ice, extreme heat, floods, cyclones and rising seas meet dense populations and heavy demand for water.',
 obj:['Identify major environmental hazards and where they occur','Explain links between climate, water and people','Evaluate local and international responses'],
 prose:['<p>The Hindu Kush Himalaya hold more ice than anywhere outside the polar regions, which is why the area is called the <b>Third Pole</b>. Its rivers support well over a billion people downstream. A 2023 ICIMOD assessment warned that its glaciers could lose up to 80% of their volume this century if emissions stay high.</p>','<p>Responses are local as well as global: the Chipko tree-huggers of the 1970s, community forestry in Nepal, tiger and rhino recovery, and the cyclone shelters and early warnings in Bangladesh and Odisha that have sharply reduced deaths since the 1970s.</p>'],
 widget:'env',
 stops:[
  {n:'Gangotri Glacier',lon:79.08,lat:30.92,d:7,tag:'Ice and water',k:'Retreating ice',t:'Like most Himalayan glaciers, Gangotri has retreated for decades. Shrinking ice threatens dry-season river flow in the long term and leaves behind new glacial lakes.'},
  {n:'South Lhonak Lake, Sikkim',lon:88.2,lat:27.92,d:7,tag:'Ice and water',k:'Glacial lake outburst · Oct 2023',t:'A glacial lake burst through its moraine dam, and the flood down the Teesta River destroyed the Teesta III dam and killed dozens of people. Warming is enlarging such lakes across the Himalaya.'},
  {n:'Joshimath',lon:79.56,lat:30.56,d:7,tag:'Ice and water',k:'Land subsidence · 2023',t:'Hundreds of buildings cracked as this hillside town sank. Experts pointed to unstable slopes, poor drainage and heavy construction in a fragile mountain zone.'},
  {n:'Kishanganga, Kashmir',lon:74.65,lat:34.65,d:8,tag:'Ice and water',k:'Shared rivers',t:'The 1960 Indus Waters Treaty, brokered by the World Bank, gave the eastern rivers (Ravi, Beas, Sutlej) to India and the western rivers (Indus, Jhelum, Chenab) mainly to Pakistan. In April 2025 India declared the treaty "in abeyance". In August 2026 a Court of Arbitration in The Hague ruled that the treaty remains in force; India rejects the court\'s authority.'},
  {n:'Punjab',lon:75.84,lat:30.25,d:9,tag:'Ice and water',k:'Falling water tables',t:'Pumping for irrigated rice and wheat has drawn groundwater down faster than rain can refill it. Satellite gravity measurements show some of the fastest groundwater losses on Earth across north-west India.'},
  {n:'Central Bangladesh',lon:90.0,lat:23.4,d:9,tag:'Ice and water',k:'Arsenic in wells',t:'Millions of tube wells dug from the 1970s to avoid polluted surface water turned out to tap arsenic-rich groundwater. The WHO called it the largest mass poisoning of a population in history.'},
  {n:'Delhi',lon:77.21,lat:28.61,d:9,tag:'Air and heat',k:'Winter smog',t:'In late autumn and winter, cool still air traps pollution from traffic, industry, dust and smoke from crop-stubble burning in Punjab and Haryana. Delhi regularly ranks among the most polluted capitals in the world.'},

const N=GW*GH;

    for(let j=GH-1;j>=0;j--)for(let i=GW-1;i>=0;i--){const k=j*GW+i;let v=D[k];if(i<GW-1)v=Math.min(v,D[k+1]+1);if(j<GH-1){v=Math.min(v,D[k+GW]+1);if(i<GW-1)v=Math.min(v,D[k+GW+1]+s);if(i>0)v=Math.min(v,D[k+GW-1]+s);}D[k]=v;}};
  dt(A);dt(B);prog(.25);await tick();

    for(let i=0;i<GW;i++){const k=j*GW+i,c=CT[k];if(!c){E[k]=0;H[k]=-70;continue;}

  const cw=DLON*KX, ch=DLAT, vs=28/111000, L=[-1,1.35,-1];const ll=Math.hypot(L[0],L[1],L[2]);L[0]/=ll;L[1]/=ll;L[2]/=ll;

function sampleGrid(G,lon,lat){
  const fx=(lon-LON0)/DLON-.5, fy=(LAT1-lat)/DLAT-.5;

function cellAt(lon,lat){const i=clamp(Math.floor((lon-LON0)/DLON),0,GW-1),j=clamp(Math.floor((LAT1-lat)/DLAT),0,GH-1);return j*GW+i;}

const hex=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const RELIEF=[[0,'#5F9455'],[120,'#7EA862'],[350,'#A9B872'],[700,'#C8B985'],[1300,'#B9976B'],[2300,'#987759'],[3500,'#857A70'],[4600,'#A7A39F'],[5500,'#DCDEE3'],[7000,'#FFFFFF']].map(s=>[s[0],hex(s[1])]);

const LANGCOL=['#E7B04F','#C9584F','#6A86C9','#9C76BE','#4FA87C'].map(hex);
const LANG_NAMES=['Indo-Aryan','Dravidian','Tibeto-Burman','Iranian','Austroasiatic'];
const SAND=hex('#D9C28E'), OC_S=hex('#9CCBDD'), OC_D=hex('#203F7E');
function ramp(R,v){if(v<=R[0][0])return R[0][1];for(let i=1;i<R.length;i++){if(v<=R[i][0]){const t=(v-R[i-1][0])/(R[i][0]-R[i-1][0]),a=R[i-1][1],b=R[i][1];return[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];}}return R[R.length-1][1];}
const mixc=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];
const TW=1520;
const texCanvas=document.createElement('canvas');texCanvas.width=TW;texCanvas.height=Math.round(TW*GH/GW);
const layerCache={};
function baseImage(layer){
  if(layerCache[layer])return layerCache[layer];
  const cv=document.createElement('canvas');cv.width=GW;cv.height=GH;const cx=cv.getContext('2d');const im=cx.createImageData(GW,GH);const px=im.data;
  const Ly=1.35/Math.hypot(1,1.35,1);

    if(!c){const t=Math.sqrt(clamp(DS[k]/2.4,0,1));col=mixc(OC_S,OC_D,t);}
    else{

      const strength=layer==='relief'?1.25:.95;
      const f=clamp(1+(SH[k]-Ly)*strength,.5,1.3);col=[col[0]*f,col[1]*f,col[2]*f];
    }
    const o=k*4;px[o]=col[0];px[o+1]=col[1];px[o+2]=col[2];px[o+3]=255;}
  cx.putImageData(im,0,0);layerCache[layer]=cv;return cv;
}
let borderCanvas=null;
function bordersImage(){
  if(borderCanvas)return borderCanvas;
  const cv=document.createElement('canvas');cv.width=GW;cv.height=GH;const cx=cv.getContext('2d');const im=cx.createImageData(GW,GH);const px=im.data;
  for(let j=0;j<GH-1;j++)for(let i=0;i<GW-1;i++){const k=j*GW+i,c=CT[k];if(!c)continue;const r=CT[k+1],d=CT[k+GW];
    if((r&&r!==c)||(d&&d!==c)){const o=k*4;px[o]=28;px[o+1]=26;px[o+2]=48;px[o+3]=235;}}
  cx.putImageData(im,0,0);borderCanvas=cv;return cv;
}
const LOC=[[74.65,32.75],[74.3,32.95],[74.0,33.3],[74.05,33.8],[73.95,34.15],[74.35,34.5],[74.9,34.7],[75.7,34.55],[76.4,34.8],[77.05,35.1],[76.8,35.6],[77.8,35.5]];
const LAC=[[77.8,35.5],[78.1,35.0],[78.3,34.6],[78.75,34.1],[78.9,33.5],[79.4,32.9],[79.2,32.5],[78.75,31.83]];
function drawBorders(cx){
  const key=p=>p[0]+','+p[1];const disp=new Set(LOC.concat(LAC).map(key));
  const INs=IN.slice(0,IN.findIndex(p=>p[0]===92.6&&p[1]===22.0)+1);
  const segs=[];
  const addPoly=(P,closed)=>{const n=P.length;for(let i=0;i<(closed?n:n-1);i++){const a=P[i],b=P[(i+1)%n];if(disp.has(key(a))&&disp.has(key(b)))continue;segs.push([a,b]);}};
  addPoly(PK,true);addPoly(AF,true);addPoly(NP,true);addPoly(BT,true);addPoly(BD,true);addPoly(INs,false);
  cx.save();cx.beginPath();MAIN.forEach((p,i)=>i?cx.lineTo(tx(p[0]),ty(p[1])):cx.moveTo(tx(p[0]),ty(p[1])));cx.closePath();cx.clip();

  path();cx.strokeStyle='rgba(30,26,50,.9)';cx.lineWidth=1.6;cx.stroke();
  cx.setLineDash([5,4]);

const mapEl=document.getElementById('map'), labelsEl=document.getElementById('labels');
const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;

  columns.visible=false;scene.add(columns);updateColumns();

}

function windVec(lon,lat){const A=WIND[state.season];let sx=0,sy=0,sw=0;for(const a of A){const dx=lon-a[0],dy=lat-a[1],w=1/(dx*dx+dy*dy+1);const w2=w*w;sx+=a[2]*w2;sy+=a[3]*w2;sw+=w2;}const x=sx/sw,y=sy/sw,l=Math.hypot(x,y)||1;return[x/l,y/l];}
const NW=900;let wp=[];
function spawn(p){p.lon=61+Math.random()*36;p.lat=2.5+Math.random()*30;p.age=Math.random()*120;p.life=90+Math.random()*90;}
function initWinds(){
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(NW*6),3));g.setAttribute('color',new THREE.BufferAttribute(new Float32Array(NW*6),3));
  windObj=new THREE.LineSegments(g,new THREE.LineBasicMaterial({vertexColors:true,transparent:true,opacity:.9}));windObj.visible=false;windObj.frustumCulled=false;scene.add(windObj);
  for(let i=0;i<NW;i++){const p={};spawn(p);wp.push(p);}
}
function stepWinds(dt){
  const pos=windObj.geometry.attributes.position.array,col=windObj.geometry.attributes.color.array;
  const head=state.season==='summer'?[1,1,1]:[1,.93,.78], tail=state.season==='summer'?[.25,.55,.95]:[.75,.55,.2];
  const sp=reduceMotion?0:2.2*dt;
  for(let i=0;i<NW;i++){const p=wp[i];const v=windVec(p.lon,p.lat);p.lon+=v[0]*sp/KX;p.lat+=v[1]*sp;p.age+=reduceMotion?0:dt*60;
    let dead=p.age>p.life||p.lon<60.2||p.lon>97.8||p.lat<2.2||p.lat>36.5;
    if(!dead&&p.lon>74&&p.lat>crestLat(p.lon)+.2)dead=true;
    if(dead){spawn(p);p.age=0;}
    const y=Math.max(terrainY(p.lon,p.lat),0)+.35;
    const a=W3(p.lon,p.lat,y),b=W3(p.lon-v[0]*.55/KX,p.lat-v[1]*.55,y);
    const o=i*6;pos[o]=a.x;pos[o+1]=a.y;pos[o+2]=a.z;pos[o+3]=b.x;pos[o+4]=b.y;pos[o+5]=b.z;
    const f=Math.sin(Math.PI*clamp(p.age/p.life,0,1));
    col[o]=head[0]*f;col[o+1]=head[1]*f;col[o+2]=head[2]*f;col[o+3]=tail[0]*f*.4;col[o+4]=tail[1]*f*.4;col[o+5]=tail[2]*f*.4;}
  windObj.geometry.attributes.position.needsUpdate=true;windObj.geometry.attributes.color.needsUpdate=true;
}

/* camera flight */
let fly=null;
function viewFor(lon,lat,dist,polar){const y=Math.max(terrainY(lon,lat),0)*.7;const tgt=W3(lon,lat,y);const az=controls?controls.getAzimuthalAngle():0;const pol=polar||.9;
  const off=new THREE.Vector3(dist*Math.sin(pol)*Math.sin(az),dist*Math.cos(pol),dist*Math.sin(pol)*Math.cos(az));return{tgt,pos:tgt.clone().add(off)};}
function flyTo(lon,lat,dist,polar){
  if(!ready)return;
  const v=viewFor(lon,lat,dist,polar);
  if(reduceMotion||!camera){camera.position.copy(v.pos);controls.target.copy(v.tgt);controls.update();return;}
  fly={t0:performance.now(),dur:1500,fromT:controls.target.clone(),fromP:camera.position.clone(),toT:v.tgt,toP:v.pos,lift:camera.position.distanceTo(v.pos)*.18};
}
function homeView(){const L=LESSONS[state.lesson];const v=L.view;const asp=camera.aspect||1.4;const d=v[2]*(asp<1.2?1.2/asp*0.74:1);flyTo(v[0],v[1],d,.82);}

let labelEls=[],pinEls=[],popEls=[];
function buildBaseLabels(){labelsEl.innerHTML='';labelEls=BASE_LABELS.map(L=>{const el=document.createElement('div');el.className='lbl '+L[0]+(L[4]?' '+L[4]:'');el.textContent=L[1];labelsEl.appendChild(el);return{el,g:L[0],lon:L[2],lat:L[3]};});
  popEls=[['Dhaka 36.6 M',90.41,23.81,36.6],['New Delhi 30.2 M',77.21,28.61,30.2],['Kolkata 22.5 M',88.36,22.57,22.5]].map(p=>{const el=document.createElement('div');el.className='lbl pop';el.textContent=p[0];el.hidden=true;labelsEl.appendChild(el);return{el,lon:p[1],lat:p[2],h:p[3]/36.6*4.2};});}
function buildPins(){pinEls.forEach(p=>p.el.remove());pinEls=[];const L=LESSONS[state.lesson];
  L.stops.forEach((s,i)=>{const b=document.createElement('button');b.className='pin';b.type='button';b.setAttribute('aria-label',s.n);b.innerHTML='<span class="tip"></span><b></b>';b.querySelector('.tip').textContent=s.n;b.querySelector('b').textContent=L.timeline?s.k.replace(/^c\. /,'').split(/[–\s]/)[0]:(i+1);b.addEventListener('click',()=>openStop(i));labelsEl.appendChild(b);pinEls.push({el:b,lon:s.lon,lat:s.lat});});}
const _v=new THREE.Vector3();
function project(lon,lat,yAdd,out){_v.copy(W3(lon,lat,Math.max(terrainY(lon,lat),0)+(yAdd||0)));_v.project(camera);out.x=(_v.x+1)/2*mapEl.clientWidth;out.y=(1-_v.y)/2*mapEl.clientHeight;out.z=_v.z;return out;}
const P={x:0,y:0,z:0};
function placeLabels(){
  const L=LESSONS[state.lesson];const w=mapEl.clientWidth,h=mapEl.clientHeight;
  for(const l of labelEls){const show=state.labels&&L.labels.includes(l.g);if(!show){if(!l.el.hidden)l.el.hidden=true;continue;}
    project(l.lon,l.lat,.15,P);const vis=P.z<1&&P.x>-80&&P.x<w+80&&P.y>-30&&P.y<h+30;l.el.hidden=!vis;if(vis)l.el.style.transform='translate('+P.x.toFixed(1)+'px,'+P.y.toFixed(1)+'px) translate(-50%,-50%)';}
  for(const p of pinEls){project(p.lon,p.lat,.02,P);const vis=P.z<1&&P.x>-40&&P.x<w+40&&P.y>-40&&P.y<h+60;p.el.hidden=!vis;if(vis){p.el.style.transform='translate('+P.x.toFixed(1)+'px,'+P.y.toFixed(1)+'px) translate(-50%,-100%)';p.el.style.zIndex=String(1000-Math.round(P.z*500));}}
  for(const p of popEls){const show=!!L.columns;if(!show){p.el.hidden=true;continue;}project(p.lon,p.lat,p.h+.3,P);p.el.hidden=P.z>=1;p.el.style.transform='translate('+P.x.toFixed(1)+'px,'+P.y.toFixed(1)+'px) translate(-50%,-100%)';}
}

/* hover readout */
let hover=null,mx=0,my=0,moveQueued=false;
function onMove(e){const r=renderer.domElement.getBoundingClientRect();mx=e.clientX-r.left;my=e.clientY-r.top;if(!moveQueued){moveQueued=true;requestAnimationFrame(()=>{moveQueued=false;pick();});}}
const ray=new THREE.Raycaster();
function pick(){
  const w=mapEl.clientWidth,h=mapEl.clientHeight;ray.setFromCamera({x:mx/w*2-1,y:-(my/h)*2+1},camera);
  const o=ray.ray.origin,d=ray.ray.direction;let t=0,hit=null,step=.15;
  for(let k=0;k<1200;k++){const x=o.x+d.x*t,y=o.y+d.y*t,z=o.z+d.z*t;const lon=x/KX+79,lat=-z+19.5;
    if(lon>=LON0&&lon<=LON1&&lat>=LAT0&&lat<=LAT1){const ty_=Math.max(terrainY(lon,lat),-.02);if(y<=ty_){hit=[lon,lat];break;}}
    if(y<-1)break;t+=step;}
  hover=hit;renderReadout();
}
function fmtLL(lon,lat){return Math.abs(lat).toFixed(2)+'°'+(lat>=0?'N':'S')+' '+lon.toFixed(2)+'°E';}
function renderReadout(){
  const el=document.getElementById('readout');if(!el)return;
  if(!hover){el.innerHTML='Point at the map to read the model.';return;}
  const k=cellAt(hover[0],hover[1]);const c=CT[k];
  if(!c){el.innerHTML='<b>'+fmtLL(hover[0],hover[1])+'</b><br>Sea';return;}
  let v='';const e=Math.round(sampleGrid(E,hover[0],hover[1]));
  if(state.layer==='relief')v=e.toLocaleString()+' m';
  else if(state.layer==='rain')v='≈ '+(Math.round(RN[k]/50)*50).toLocaleString()+' mm a year';
  else if(state.layer==='lang')v=LANG_NAMES[LG[k]]+' area';
  else v=C_NAMES[c];
  el.innerHTML='<b>'+fmtLL(hover[0],hover[1])+'</b><br>'+v+(state.layer!=='relief'?' · '+e.toLocaleString()+' m':'');
}

/* charts */
function drawProfile(){
  const el=document.getElementById('profile');if(!el)return;
  const Wd=560,Hd=220,ml=46,mr=12,mt=14,mb=34,iw=Wd-ml-mr,ih=Hd-mt-mb,la0=8.3,la1=35.8,ymax=8000;
  const X=lat=>ml+(lat-la0)/(la1-la0)*iw, Y=e=>mt+ih-(e/ymax)*ih;
  let d='M'+X(la0)+','+Y(0);for(let lat=la0;lat<=la1;lat+=.05){d+=' L'+X(lat).toFixed(1)+','+Y(Math.max(0,sampleGrid(H,78,lat))).toFixed(1);}d+=' L'+X(la1)+','+Y(0)+' Z';
  let g='';[0,2000,4000,6000,8000].forEach(v=>{g+='<line x1="'+ml+'" x2="'+(Wd-mr)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="var(--line)" stroke-width="1"/><text x="'+(ml-6)+'" y="'+(Y(v)+4)+'" text-anchor="end" font-size="10" fill="var(--muted)" font-family="IBM Plex Mono,monospace">'+(v?v/1000+'k':'0')+'</text>';});
  [10,15,20,25,30,35].forEach(v=>{g+='<text x="'+X(v)+'" y="'+(Hd-14)+'" text-anchor="middle" font-size="10" fill="var(--muted)" font-family="IBM Plex Mono,monospace">'+v+'°N</text>';});
  const cr=crestLat(78);
  const marks=[[10.2,'Tamil Nadu'],[16.5,'Deccan'],[22.0,'Satpura'],[23.5,'Vindhya'],[27.3,'Ganga Plain'],[cr,'Great Himalaya'],[33.8,'Tibet']];
  let m='';marks.forEach((k,i)=>{const e=Math.max(0,sampleGrid(H,78,k[0]));const yy=Y(e)-6-(i%2)*14;m+='<line x1="'+X(k[0])+'" x2="'+X(k[0])+'" y1="'+(Y(e)-3)+'" y2="'+(yy+3)+'" stroke="var(--muted)" stroke-width=".8"/><text x="'+X(k[0])+'" y="'+yy+'" text-anchor="middle" font-size="10.5" fill="var(--ink)" font-family="Bricolage Grotesque,system-ui,sans-serif" font-weight="600">'+k[1]+'</text>';});
  el.innerHTML='<svg viewBox="0 0 '+Wd+' '+Hd+'" role="img" aria-label="Elevation cross-section along 78 degrees east from 8 to 36 degrees north">'+g+'<path d="'+d+'" fill="var(--turmeric)" fill-opacity=".35" stroke="var(--turmeric)" stroke-width="1.4"/>'+m+'<text x="'+ml+'" y="'+(Hd-1)+'" font-size="10" fill="var(--muted)" font-family="IBM Plex Mono,monospace">metres · south → north</text></svg>';
}
function drawMonthly(){
  const el=document.getElementById('monthly');if(!el)return;
  const mum=[1,1,0,1,11,527,840,586,341,89,15,4],che=[25,5,4,15,48,55,104,124,118,267,309,139],mo='JFMAMJJASOND';
  const Wd=560,Hd=200,ml=40,mr=10,mt=24,mb=26,iw=Wd-ml-mr,ih=Hd-mt-mb,ymax=900,bw=iw/12;
  const Y=v=>mt+ih-v/ymax*ih;let s='';
  [0,300,600,900].forEach(v=>{s+='<line x1="'+ml+'" x2="'+(Wd-mr)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="var(--line)"/><text x="'+(ml-6)+'" y="'+(Y(v)+4)+'" text-anchor="end" font-size="10" fill="var(--muted)" font-family="IBM Plex Mono,monospace">'+v+'</text>';});
  for(let i=0;i<12;i++){const x=ml+i*bw;s+='<rect x="'+(x+bw*.14).toFixed(1)+'" y="'+Y(mum[i]).toFixed(1)+'" width="'+(bw*.34).toFixed(1)+'" height="'+(Y(0)-Y(mum[i])).toFixed(1)+'" fill="var(--indigo)" rx="1.5"><title>Mumbai '+mo[i]+': '+mum[i]+' mm</title></rect><rect x="'+(x+bw*.52).toFixed(1)+'" y="'+Y(che[i]).toFixed(1)+'" width="'+(bw*.34).toFixed(1)+'" height="'+(Y(0)-Y(che[i])).toFixed(1)+'" fill="var(--turmeric)" rx="1.5"><title>Chennai '+mo[i]+': '+che[i]+' mm</title></rect><text x="'+(x+bw/2).toFixed(1)+'" y="'+(Hd-8)+'" text-anchor="middle" font-size="10" fill="var(--muted)" font-family="IBM Plex Mono,monospace">'+mo[i]+'</text>';}
  s+='<rect x="'+ml+'" y="6" width="10" height="10" fill="var(--indigo)" rx="2"/><text x="'+(ml+15)+'" y="15" font-size="11" fill="var(--ink)" font-family="Bricolage Grotesque,system-ui,sans-serif">Mumbai (west coast)</text><rect x="'+(ml+150)+'" y="6" width="10" height="10" fill="var(--turmeric)" rx="2"/><text x="'+(ml+165)+'" y="15" font-size="11" fill="var(--ink)" font-family="Bricolage Grotesque,system-ui,sans-serif">Chennai (east coast)</text>';
  el.innerHTML='<svg viewBox="0 0 '+Wd+' '+Hd+'" role="img" aria-label="Monthly rainfall: Mumbai peaks in July; Chennai peaks in November">'+s+'</svg>';
}

/* quiz */
let quizAns=QUIZ.map(()=>-1);
function quizHTML(){const done=quizAns.filter(a=>a>=0).length,right=quizAns.filter((a,i)=>a===QUIZ[i].a).length;
  return '<section class="quiz"><div class="score">Score <b>'+right+' / '+QUIZ.length+'</b><span class="src">'+done+' answered</span>'+(done?'<button class="tourbtn" id="qreset" style="margin:0">Start over</button>':'')+'</div>'+QUIZ.map((q,i)=>{const a=quizAns[i];return '<div class="q"><h3><i>Question '+(i+1)+'</i>'+esc(q.q)+'</h3><div class="opts">'+q.o.map((o,j)=>{let c='';if(a>=0){if(j===q.a)c='ok';else if(j===a)c='no';}return '<button data-q="'+i+'" data-o="'+j+'" class="'+c+'"'+(a>=0?' disabled':'')+'>'+esc(o)+'</button>';}).join('')+'</div>'+(a>=0?'<p class="fb"><b style="color:'+(a===q.a?'var(--good)':'var(--bad)')+'">'+(a===q.a?'Correct.':'Not quite.')+'</b> '+esc(q.ex)+'</p>':'')+'</div>';}).join('')+'</section>';}
function answer(i,o){if(quizAns[i]>=0)return;quizAns[i]=o;const st=panel.scrollTop;renderPanel();panel.scrollTop=st;const q=QUIZ[i];flyTo(q.lon,q.lat,q.d,.85);
  const qs=panel.querySelectorAll('.q');if(qs[i]){const b=qs[i].querySelector('button.ok');if(b)b.focus({preventScroll:true});}}

/* stops / card / tour */
const card=document.getElementById('card');
function openStop(i){const L=LESSONS[state.lesson],s=L.stops[i];if(!s)return;state.stop=i;flyTo(s.lon,s.lat,s.d||9,.88);
  card.hidden=false;mapEl.classList.add('carded');
  const el=s.k?'<div class="k">'+esc(s.k)+'</div>':'';
  card.innerHTML='<button class="x" aria-label="Close">×</button>'+el+'<h3>'+esc(s.n)+'</h3><div class="co">'+fmtLL(s.lon,s.lat)+' · model elevation '+Math.round(sampleGrid(E,s.lon,s.lat)).toLocaleString()+' m</div><p>'+esc(s.t)+'</p><div class="nav"><span class="ct">'+(i+1)+' of '+L.stops.length+'</span><button data-d="-1"'+(i===0?' disabled':'')+'>‹ Prev</button><button data-d="1"'+(i===L.stops.length-1?' disabled':'')+'>Next ›</button></div>';
  pinEls.forEach((p,j)=>p.el.classList.toggle('on',j===i));
  panel.querySelectorAll('.stop').forEach(b=>b.classList.toggle('on',+b.dataset.s===i));
}
function closeCard(){card.hidden=true;mapEl.classList.remove('carded');state.stop=-1;pinEls.forEach(p=>p.el.classList.remove('on'));panel.querySelectorAll('.stop').forEach(b=>b.classList.remove('on'));stopTour();}
card.addEventListener('click',e=>{if(e.target.closest('.x')){closeCard();return;}const b=e.target.closest('[data-d]');if(b){stopTour();openStop(state.stop+(+b.dataset.d));}});
let tourTimer=null;
function setTourBtn(){const b=document.getElementById('tour');if(b)b.textContent=tourTimer?'Stop tour':'▶ Play tour';}
function startTour(){const L=LESSONS[state.lesson];openStop(state.stop>=0&&state.stop<L.stops.length-1?state.stop+1:0);tourTimer=setInterval(()=>{const L2=LESSONS[state.lesson];if(state.stop>=L2.stops.length-1){stopTour();return;}openStop(state.stop+1);},7500);setTourBtn();}
function stopTour(){if(tourTimer){clearInterval(tourTimer);tourTimer=null;}setTourBtn();}

/* lessons */
function go(i,fromHash){
  stopTour();state.lesson=clamp(i,0,LESSONS.length-1);state.stop=-1;const L=LESSONS[state.lesson];
  renderTabs();const t=tabs.querySelector('[aria-current="true"]');if(t&&t.scrollIntoView)t.scrollIntoView({block:'nearest',inline:'nearest'});
  card.hidden=true;mapEl.classList.remove('carded');
  if(L.id==='monsoon'){const m=new Date().getMonth();state.season=(m>=9||m<=1)?'winter':'summer';state.windsOn=true;}
  renderPanel();
  if(ready){setLayer(L.layer);buildPins();transect.visible=L.widget==='profile';columns.visible=!!L.columns;homeView();}
  if(!fromHash){try{history.replaceState(null,'','#'+L.id);}catch(_){location.hash=L.id;}}
}
window.addEventListener('hashchange',()=>{const i=LESSONS.findIndex(l=>'#'+l.id===location.hash);if(i>=0&&i!==state.lesson)go(i,true);});

/* map controls */
document.getElementById('layers').addEventListener('click',e=>{const b=e.target.closest('button');if(b&&ready)setLayer(b.dataset.l);});
document.querySelector('.ctl .row').addEventListener('click',e=>{const b=e.target.closest('button');if(!b||!ready)return;if(b.id==='resetView'){closeCard();homeView();return;}
  const k=b.dataset.t;state[k]=!state[k];b.setAttribute('aria-pressed',String(state[k]));if(k!=='labels'){paintTexture(state);texture.needsUpdate=true;}});
const ex=document.getElementById('exag'),exo=document.getElementById('exagOut');
ex.addEventListener('input',()=>{EXAG=+ex.value;exo.textContent=EXAG;if(!ready)return;terrain.scale.y=yScale();updateTransect();updateColumns();});
const mo=new MutationObserver(syncThemeColors);mo.observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
matchMedia('(prefers-color-scheme: dark)').addEventListener&&matchMedia('(prefers-color-scheme: dark)').addEventListener('change',syncThemeColors);

/* loop */
let ready=false,last=performance.now();
function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(fly){const t=clamp((now-fly.t0)/fly.dur,0,1),k=t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
    controls.target.lerpVectors(fly.fromT,fly.toT,k);camera.position.lerpVectors(fly.fromP,fly.toP,k);camera.position.y+=Math.sin(Math.PI*k)*fly.lift;if(t>=1)fly=null;}
  controls.update();
  const L=LESSONS[state.lesson];
  windObj.visible=!!L.winds&&state.windsOn;if(windObj.visible)stepWinds(dt);
  renderer.render(scene,camera);placeLabels();
}

/* boot */
const initial=Math.max(0,LESSONS.findIndex(l=>'#'+l.id===location.hash));
state.lesson=initial;renderTabs();renderPanel();renderLegend();
(async function(){
  const pb=document.getElementById('pbar');const prog=f=>{pb.style.width=(f*100).toFixed(0)+'%';};
  await tick();await buildFields(prog);
  if(!window.THREE||!THREE.OrbitControls){document.querySelector('#loader div').textContent='The 3D library could not load. Check your connection and reload.';return;}
  paintTexture(state);initScene();buildBaseLabels();ready=true;
  go(state.lesson,true);
  const v=viewFor(LESSONS[state.lesson].view[0],LESSONS[state.lesson].view[1],LESSONS[state.lesson].view[2]*1.5,.6);camera.position.copy(v.pos);controls.target.copy(v.tgt);controls.update();homeView();
  prog(1);document.getElementById('loader').hidden=true;requestAnimationFrame(loop);
})();
})();
</script>
</body>
